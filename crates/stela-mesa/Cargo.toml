[package]
name = "stela-mesa"
version = "0.0.0"
edition = "2024"
publish = false
license = "GPL-2.0-or-later AND MIT AND Apache-2.0 WITH LLVM-exception"
description = "Mesa's NVK or RADV with NIR, linked into stela.efi"
repository = "https://github.com/tylertms/Stela"
rust-version = "1.99"
build = "build.rs"

# A workspace of none: this crate and the ones it names build only for
# `stela.efi`, from sources `cargo xtask gpu nvk` or `gpu radv` generates.

[features]
# NVK, with NAK and NIL, from `cargo xtask gpu nvk`.
nvk = ["dep:nak", "dep:nil"]
# RADV, with ACO and addrlib, which are C and C++, from `cargo xtask gpu radv`.
radv = []

[dependencies]
nak = { package = "stela-mesa-nak", path = "nak", optional = true }
nil = { package = "stela-mesa-nil", path = "nil", optional = true }

[build-dependencies]
stela-fingerprint = { path = "../stela-fingerprint" }
